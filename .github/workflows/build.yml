name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: MSVC 2005 x86
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ca-certificates make wine wine64 wine32:i386 winbind clang-format-18 clang-tidy-18 llvm-18
          python3 -m pip install capstone==5.0.9
      - name: Cache pinned compiler, linker, SDK and objdiff
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/tools/msvc8
            build/tools/bin
          key: matching-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchain.json', 'config/tools.json') }}
      - name: Cache pinned adapted Ogg and Vorbis
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lib/.cache
          key: ogg-vorbis-${{ hashFiles('config/ogg-vorbis.json') }}
      - name: Materialize pinned Ogg and Vorbis
        run: python3 tools/dependencies.py
      - name: Download or verify pinned tools
        run: python3 tools/setup.py
      - name: Check C and C++ formatting and lint
        run: make -j"$(nproc)" lint
        env:
          CLANG_FORMAT: clang-format-18
          CLANG_TIDY: clang-tidy-18
      - name: Check project and tooling
        run: make -j"$(nproc)" check-core
      - name: Build executable and check symbol coverage
        run: make -j"$(nproc)" build check-objects
      - name: Upload build output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: saga-pc-matching
          path: build/LEGOStarWarsSaga.exe
          if-no-files-found: error
      - name: Build Debug diagnostics and map
        run: make -j"$(nproc)" BUILD_KIND=Debug build
      - name: Upload Debug build output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: saga-pc-debug
          path: |
            build/LEGOStarWarsSaga_debug.exe
            build/LEGOStarWarsSaga_debug.pdb
            build/Debug/LEGOStarWarsSaga_debug.map
            build/saga_debug_capture.exe
          if-no-files-found: error
      # Matching runs locally against the user's copy of the original executable.
