name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: MSVC 2005 x86
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo dpkg --add-architecture i386
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [[ -f "$apt_source_file" ]]; then
              sudo sed -i -E \
                -e 's|mirror[+]file:/+etc/apt/apt-mirrors[.]txt|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|mirror[+]file:/+etc/apt/apt-mirrors-security[.]txt|https://security.ubuntu.com/ubuntu|g' \
                -e 's|https?://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$apt_source_file"
            fi
          done
          apt_options=(
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::http::Dl-Limit=0
            -o Acquire::https::Dl-Limit=0
            -o Acquire::Retries=1
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ca-certificates make wine wine64 wine32:i386 winbind clang-format-18 clang-tidy-18 llvm-18 7zip
          python3 -m pip install --timeout 30 --retries 1 capstone==5.0.9 libclang==18.1.1
      - name: Cache pinned compilers, linker, SDK and objdiff
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/tools/msvc8
            build/tools/msvc8-rtm
            build/tools/msvc8-runtime
            build/tools/bin
          key: matching-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchain.json', 'config/tools.json') }}
      - name: Cache pinned adapted Ogg and Vorbis
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lib/.cache
          key: ogg-vorbis-${{ hashFiles('config/ogg-vorbis.json') }}
      - name: Materialize pinned Ogg and Vorbis
        run: python3 tools/dependencies.py
      - name: Download or verify pinned tools
        run: python3 tools/setup.py
      - name: Cache declaration scan facts
        # tools/declscan.py keys each unit by its text and all headers; a restored older
        # cache still covers the units whose inputs did not change.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/declscan
          key: declscan-${{ hashFiles('tools/declscan.py', 'src/**', 'lib/ogg-vorbis/**/*.h') }}
          restore-keys: declscan-
      - name: Cache cast scan facts
        # tools/castscan.py keys each unit by its text and the src/ headers, like declscan.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/castscan/cache.json
          key: castscan-${{ hashFiles('tools/castscan.py', 'src/**') }}
          restore-keys: castscan-
      - name: Fetch main history for the budget guard
        # Commits only (no trees or blobs); tools/budget.py --guard compares the budget files
        # with the merge base and reads the two files it needs on demand.
        run: |
          git fetch --no-tags --filter=tree:0 --unshallow origin +refs/heads/main:refs/remotes/origin/main \
            || git fetch --no-tags --filter=tree:0 origin +refs/heads/main:refs/remotes/origin/main
      - name: Check project and tooling
        run: make -j"$(nproc)" check-core
      - name: Build executable, check symbol coverage and the warning budget
        run: make -j"$(nproc)" build check-objects check-warnings
      - name: Upload build output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: saga-pc-matching
          path: build/LEGOStarWarsSaga.exe
          if-no-files-found: error
      - name: Build Debug diagnostics and map, check the warning budget
        run: make -j"$(nproc)" BUILD_KIND=Debug build check-warnings
      - name: Upload Debug build output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: saga-pc-debug
          path: |
            build/LEGOStarWarsSaga_debug.exe
            build/LEGOStarWarsSaga_debug.pdb
            build/Debug/LEGOStarWarsSaga_debug.map
            build/saga_debug_capture.exe
          if-no-files-found: error
      - name: Upload compiler warnings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: saga-pc-warnings
          path: |
            build/warnings.json
            build/Debug/warnings.json
          if-no-files-found: ignore
      # Matching runs locally against the user's copy of the original executable.

  # clang-format and clang-tidy (make lint) run beside the build, with the clang-tidy jobs split over
  # four runners. Each runner keeps the passes of its own share in build/lint/tidy-cache (see
  # tools/lintcache.py): a pass is reused only while the tool, policy, flags and every file the unit
  # read are unchanged, so a typical push analyses only the units it touched.
  lint:
    name: Lint ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Clang 18 tools
        # The runner image ships them; install only if an image update dropped them.
        run: |
          if ! command -v clang-format-18 >/dev/null || ! command -v clang-tidy-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-format-18 clang-tidy-18
          fi
      - name: Restore pinned compilers and SDK
        # Restore only: the build job saves this cache with everything it installs.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/tools/msvc8
            build/tools/msvc8-rtm
            build/tools/msvc8-runtime
            build/tools/bin
          key: matching-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchain.json', 'config/tools.json') }}
      - name: Restore pinned adapted Ogg and Vorbis
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lib/.cache
          key: ogg-vorbis-${{ hashFiles('config/ogg-vorbis.json') }}
      - name: Materialize Ogg and Vorbis, verify or download the pinned SDK headers
        run: |
          python3 tools/dependencies.py
          python3 tools/setup.py --compiler-only
      - name: Cache clang-tidy passes
        # Saved under this commit; the newest earlier cache of this share is the starting point.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/lint/tidy-cache
          key: tidy-${{ matrix.shard }}of4-${{ github.sha }}
          restore-keys: tidy-${{ matrix.shard }}of4-
      - name: Check C and C++ formatting
        if: matrix.shard == 1
        run: python3 tools/check.py --format
        env:
          CLANG_FORMAT: clang-format-18
      - name: Lint with clang-tidy (share ${{ matrix.shard }} of 4)
        run: python3 tools/check.py --tidy --jobs "$(nproc)" --shard ${{ matrix.shard }}/4
        env:
          CLANG_TIDY: clang-tidy-18

  lint-result:
    # One stable check name for branch protection, whatever the number of shares.
    name: Lint
    needs: lint
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All lint shares passed
        run: test "$LINT_RESULT" = success
        env:
          LINT_RESULT: ${{ needs.lint.result }}
